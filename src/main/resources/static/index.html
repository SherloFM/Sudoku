<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Solver</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7;
      color: #1f2430;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
      width: min(90vw, 420px);
      text-align: center;
    }
    h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
    p  { margin: 0 0 1.5rem; color: #6b7280; font-size: .9rem; }
    input[type=file] {
      display: block;
      width: 100%;
      padding: .75rem;
      border: 1.5px dashed #cbd5e1;
      border-radius: 10px;
      background: #fafbfc;
      margin-bottom: 1rem;
      font-size: .9rem;
    }
    button {
      width: 100%;
      padding: .75rem;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Sudoku Solver</h1>
    <p>Upload a .txt puzzle to download the solved board.</p>

    <form action="/solve" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept=".txt,text/plain" required>
      <button type="submit">Solve &amp; Download</button>
    </form>
  </main>
</body>
</html>
